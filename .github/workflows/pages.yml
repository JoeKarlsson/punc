name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The sitemap's lastmod dates come from git history. Trees only, no
          # old file contents (the full history is about 850 MB).
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - run: npm run site:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist
          # .well-known/security.txt is a dot directory
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
