<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 0 328 660" width="328" height="660" role="img" aria-label="Dot and interval chart: the share of the 1700-49 to 1900-49 drop in sentence length that disappears when semicolons and colons count as sentence ends, measured eleven ways with 95% bootstrap intervals. Weighted by the hand-coded glue rate: 38% (28 to 48). Weighted with a strict sentence splitter: 42%. Semicolons only: 42%. Dashes counted too: 43%. Base count: 47% (38 to 60). Plays and poetry removed: 48%. English originals: 48%. Measured from 1750-99: 49%. Strict sentence splitter: 52%. Narration only: 54%. English originals by both checks: 58% (50 to 61). Every estimate lands between 38% and 58%; a line marks about 40%.">
<defs></defs>
<text x="16" y="18" font-family="Anton, Impact, sans-serif" font-size="19" fill="#ededed" text-anchor="start" dominant-baseline="central">EVERY WAY OF COUNTING</text>
<text x="16" y="37" font-family="Fraunces, Georgia, serif" font-size="14" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">Share of the drop that is punctuation</text>
<path d="M28,84 L28,598" fill="none" stroke="#2c2c2c" stroke-width="1" stroke-linecap="round"/>
<text x="28" y="614" font-family="Fraunces, Georgia, serif" font-size="13" fill="#a3a3a3" text-anchor="middle" dominant-baseline="central">0%</text>
<path d="M105.1,84 L105.1,598" fill="none" stroke="#2c2c2c" stroke-width="1" stroke-linecap="round"/>
<text x="105.1" y="614" font-family="Fraunces, Georgia, serif" font-size="13" fill="#a3a3a3" text-anchor="middle" dominant-baseline="central">20%</text>
<path d="M182.3,84 L182.3,598" fill="none" stroke="#2c2c2c" stroke-width="1" stroke-linecap="round"/>
<text x="182.3" y="614" font-family="Fraunces, Georgia, serif" font-size="13" fill="#a3a3a3" text-anchor="middle" dominant-baseline="central">40%</text>
<path d="M259.4,84 L259.4,598" fill="none" stroke="#2c2c2c" stroke-width="1" stroke-linecap="round"/>
<text x="259.4" y="614" font-family="Fraunces, Georgia, serif" font-size="13" fill="#a3a3a3" text-anchor="middle" dominant-baseline="central">60%</text>
<text x="16" y="104" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">Weighted by hand-coded glue rate</text>
<text x="16" y="150" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">Weighted + strict sentence splitter</text>
<text x="16" y="196" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">Semicolons only</text>
<text x="16" y="242" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">Dashes count as stops too</text>
<text x="16" y="288" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">Base: ; and : count as stops</text>
<text x="16" y="334" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">Plays and poetry removed</text>
<text x="16" y="380" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">English originals (catalog flag)</text>
<text x="16" y="426" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">Measured from 1750-99</text>
<text x="16" y="472" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">Strict sentence splitter</text>
<text x="16" y="518" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">Narration only</text>
<text x="16" y="564" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">English originals (both checks)</text>
