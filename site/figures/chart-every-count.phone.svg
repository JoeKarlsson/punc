ecap="round" x1="220.9" x2="263.3" opacity="1"></line><circle cy="582" r="6" fill="#ff4fd8" stroke="#151515" stroke-width="2" cx="251.7"></circle><text x="273.3" y="582" font-family="Fraunces, Georgia, serif" font-size="14" font-weight="700" fill="#ff4fd8" text-anchor="start" dominant-baseline="central" opacity="1">58%</text><line x1="182.3" x2="182.3" y1="112" stroke="#ece6da" stroke-width="2.5" stroke-dasharray="6 5" y2="132" opacity="1"></line><line x1="182.3" x2="182.3" y1="158" stroke="#ece6da" stroke-width="2.5" stroke-dasharray="6 5" y2="178" opacity="1"></line><line x1="182.3" x2="182.3" y1="204" stroke="#ece6da" stroke-width="2.5" stroke-dasharray="6 5" y2="224" opacity="1"></line><line x1="182.3" x2="182.3" y1="250" stroke="#ece6da" stroke-width="2.5" stroke-dasharray="6 5" y2="270" opacity="1"></line><line x1="182.3" x2="182.3" y1="296" stroke="#ece6da" stroke-width="2.5" stroke-dasharray="6 5" y2="316" opacity="1"></line><line x1="182.3" x2="182.3" y1="342" stroke="#ece6da" stroke-width="2.5" stroke-dasharray="6 5" y2="362" opacity="1"></line><line x1="182.3" x2="182.3" y1="388" stroke="#ece6da" stroke-width="2.5" stroke-dasharray="6 5" y2="408" opacity="1"></line><line x1="182.3" x2="182.3" y1="434" stroke="#ece6da" stroke-width="2.5" stroke-dasharray="6 5" y2="454" opacity="1"></line><line x1="182.3" x2="182.3" y1="480" stroke="#ece6da" stroke-width="2.5" stroke-dasharray="6 5" y2="500" opacity="1"></line><line x1="182.3" x2="182.3" y1="526" stroke="#ece6da" stroke-width="2.5" stroke-dasharray="6 5" y2="546" opacity="1"></line><line x1="182.3" x2="182.3" y1="572" stroke="#ece6da" stroke-width="2.5" stroke-dasharray="6 5" y2="592" opacity="1"></line><text x="182.3" y="634" font-family="Anton, Impact, sans-serif" font-size="15" fill="#ededed" text-anchor="middle" dominant-baseline="central" letter-spacing="0.5" opacity="1">about 40%</text>
