<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 660" width="360" height="660" role="img" aria-label="Dot and interval chart: the share of the 1700-49 to 1900-49 drop in sentence length that is punctuation, measured eleven ways with 95% intervals. Each way counts a semicolon or colon only as often as it glues two clauses, except the last. Dashes counted as stops: 39%. Measured from 1750-99: 39%. The second coder's rates: 39%. The main estimate, all books: 40% (24 to 51). Each era's own glue rates: 41%. Plays and poetry removed: 41%. Editors' notes removed: 41%. Strict sentence splitter: 43%. Narration only: 45%. English originals, checked by title page: 45% (29 to 53). Every semicolon and colon counted as a stop: 48% (33 to 61). A line marks about 40%.">
